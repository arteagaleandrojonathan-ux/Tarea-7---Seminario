<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="actividad4.css">
</head>
<body>
    
    <h2>PERSONAJES DE LOS SIMPSONS</h2>

    <form id="formulario">
        <div>
            <label for="idPersonaje">Buscar personaje por ID</label>
            <input type="number" id="idPersonaje"
                   placeholder="Ejemplo: 1" min="1" required>
            <button type="submit">Buscar</button>
        </div>

        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" readonly>
        </div>

        <div>
            <label for="ocupacion">Ocupación</label>
            <input type="text" id="ocupacion" readonly>
        </div>

        <div>
            <label>Imagen del personaje</label>
            <img id="imagen" src="" width="200">
        </div>
    </form>

    <script src="actividad4.js"></script>
</body>
</html>
