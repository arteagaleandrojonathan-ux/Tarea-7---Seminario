<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="actividad1.css">
</head>
<body>
    
    <h2>BUSCADOR DE PLANETAS</h2>
    
    <form action="" id="formPlanetas">
        <div>
            <label for="" >Ingresar el ID de un planeta</label>
            <input type="number" placeholder="Ejem: 1" id="idPlanetas" min="" required>
            <button type="submit" id="boton">BUSCAR</button>
        </div>

        <div>
            <label for="NombrePlaneta">Nombre </label>
            <input type="text" id="NombrePlaneta">
        </div>
            
        <div>
            <label for="Diametro">Diametro</label>
            <input type="number" id="Diametro">
        </div>

        <div>
            <label for="Gravedad">Gravedad</label>
            <input type="text" id="Gravedad">
        </div>

        <div>
            <label for="Terreno">Terreno</label>
            <input type="text" id="Terreno">
        </div>

        <div>
            <label for="Clima">Clima</label>
            <input type="text" id="Clima">
        </div>
        
    </form>
    <script src="actividad1.js"></script>

</body>
</html>
