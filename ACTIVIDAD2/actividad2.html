<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="actividad2.css">
</head>
<body>    
    
    <h2>NAVES ESPACIALES</h2>

    <form action="" id="formulario">
        <div>
            <label for="idNave">Buscar Nave por ID</label>
            <input type="number"  id="idNave" placeholder="Ejem: 1" min="1" required>
            <button type="submit">Buscar</button>
        </div>

        <div>
            <label for="NombreNave">Nombre</label>
            <input type="text" id="NombreNave">
        </div>

        <div>
            <label for="Modelo">Modelo</label>
            <input type="text" id="Modelo">
        </div>

        <div>
            <label for="MaxVelocidad">MAS. Velocidad</label>
            <input type="number" id="MaxVelocidad">
        </div>

        <div>
            <label for="Clase">Clase Estelar</label>
            <input type="text" id="Clase">
        </div>

        <div>
            <label for="Longitud">Su longitud</label>
            <input type="number" id="Longitud">
        </div>

    </form>
    <script src="actividad2.js"></script>
</body>
</html>
